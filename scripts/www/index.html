<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="江城">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon.png">
<title>江城 v4.1</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
/* ═══════════════════════════════════════════
   CSS Variables & Reset
   方案一 Warm Sun-Kissed Coastal 微调
   ═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f9f3e6;           /* 暖象牙色 */
  --bg2:#f0e9da;          /* 深暖沙色 */
  --bg3:#e8e0cf;          /* 最深暖沙色 */
  --card:#fffbf7;         /* 瓦白 */
  --card-hover:#faf5ee;   /* 暖白hover */
  --text:#3d3630;         /* 暖棕 */
  --text2:#8a7d72;        /* 灰褐 */
  --accent:#FEA982;       /* 暖珊瑚桃 */
  --accent2:#70C7E2;      /* 晴空蓝 */
  --green:#5da88a;        /* 海绿 */
  --red:#e0556a;          /* 珊瑚红 */
  --yellow:#d4a546;       /* 暖金 */
  --shadow:0 2px 16px rgba(0,0,0,.05);
  --radius:14px; --radius-sm:10px;
  --font:'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
  --tab-height:64px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{
  height:100%;width:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse at 50% 0%, rgba(254,169,130,.06), transparent 60%),
             radial-gradient(ellipse at 80% 100%, rgba(112,199,226,.05), transparent 50%);
  pointer-events:none;
}
input,button,select,textarea{
  font-family:var(--font);font-size:inherit;
}

/* ═══════════════════════════════════════════
   App Shell Layout
   ═══════════════════════════════════════════ */
.app{
  display:flex;flex-direction:column;
  height:100%;height:100dvh;overflow:hidden;
}
.page{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--tab-height) + var(--safe-bottom) + 4px);
  scroll-behavior:smooth;
  display:none;
}
.page.active{display:flex;flex-direction:column;}
.page-content{flex:1;padding:12px;}

/* Map page -- scrollable: map on top, info below */
#page-map{
  display:none;
  background:var(--bg);
  position:relative;
  overflow-y:auto;
}
#page-map.active{display:flex;flex-direction:column}
#page-map .page-content{
  background:transparent;padding:0;
  flex:1;overflow-y:auto;
}

/* Map top bar removed */

/* Map container -- in document flow, aspect-ratio based */
#page-map .map-container{
  position:relative;
  width:100%;aspect-ratio:600/1100;
  background:transparent;border:none;border-radius:0;
  overflow:hidden;
  touch-action:pan-y;
  flex-shrink:0;
}
#page-map .map-container svg{
  width:100%;height:100%;
  display:block;
}
/* Fullscreen removed — map scrolls naturally, no separate fullscreen mode */

/* Info card -- below map in document flow, auto-height */
.map-info-sheet{
  background:var(--card);
  padding:12px 16px;
  display:none;height:auto;min-height:unset;
  border-top:1px solid rgba(0,0,0,.04);
}
.map-info-sheet.visible{
  display:block;
  animation:slideUp .25s ease;
}
/* Drag handle pseudo-element */
.map-info-sheet::before{
  content:'';display:block;
  width:36px;height:5px;
  background:rgba(0,0,0,.10);
  border-radius:3px;
  margin:0 auto 10px;
}
.map-info-sheet .map-info-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.map-info-sheet .map-info-avt{
  width:52px;height:52px;border-radius:50%;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  border:2px solid rgba(254,169,130,.2);
}
.map-info-sheet .map-info-avt img{width:100%;height:100%;object-fit:cover}
.map-info-sheet .map-info-name{font-size:17px;font-weight:700;color:var(--text)}
.map-info-sheet .map-info-meta{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.map-info-sheet .map-info-section{margin-top:8px}
.map-info-sheet .map-info-section h4{font-size:11px;color:var(--accent);margin-bottom:6px;font-weight:500;letter-spacing:.5px}
.map-info-sheet .map-info-section p{font-size:13px;line-height:1.6;color:var(--text)}

/* Map fullscreen mode */
#page-map.fullscreen .tab-bar{display:none}
#page-map.fullscreen .map-container{bottom:0}

/* Pin labels */
#page-map .map-pin-label{
  color:var(--text);font-size:10px;font-weight:600;
  text-shadow:0 0 8px rgba(255,255,255,.95),0 0 3px rgba(255,255,255,.8),0 1px 3px rgba(0,0,0,.12);
  background:rgba(255,255,255,.55);
  padding:2px 6px;border-radius:8px;
  margin-top:2px;white-space:nowrap;
  pointer-events:none;line-height:1.3;
}

/* ═══════════════════════════════════════════
   Bottom Tab Bar
   ═══════════════════════════════════════════ */
.tab-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;
  height:var(--tab-height);
  padding-bottom:var(--safe-bottom);
  background:rgba(249,243,230,.95);
  border-top:none;
  box-shadow:0 -4px 24px rgba(0,0,0,.04);
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;min-height:44px;
  border:none;background:none;cursor:pointer;
  color:var(--text2);font-size:10px;gap:2px;
  transition:color .2s,transform .15s;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.tab-btn:active{transform:scale(.94)}
.tab-btn .tab-icon{font-size:22px;line-height:1;}
.tab-btn.active{color:var(--accent);}
.tab-btn.active::after{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:24px;height:3px;border-radius:0 0 3px 3px;
  background:var(--accent);
}

/* Badge on tab */
.tab-badge{
  position:absolute;top:4px;right:calc(50% - 30px);
  min-width:18px;height:18px;line-height:18px;
  border-radius:9px;background:var(--red);
  color:#fff;font-size:10px;text-align:center;padding:0 5px;
  font-weight:600;
}
.tab-badge:empty{display:none}

/* ═══════════════════════════════════════════
   Chat Tab Styles
   ═══════════════════════════════════════════ */
.chat-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:rgba(255,251,247,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,0,0,.05);
  flex-shrink:0;
}
.chat-header h2{
  font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.conn-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
  transition:background .3s,box-shadow .3s;
}
.conn-dot.online{background:var(--green);box-shadow:0 0 8px rgba(93,168,138,.5)}
.conn-dot.offline{background:var(--red);box-shadow:0 0 8px rgba(224,85,106,.5)}
.conn-label{font-size:11px;margin-left:4px;color:var(--text2)}

/* Character status bar */
.char-status-bar{
  display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;
  background:var(--card);border-bottom:1px solid var(--bg3);
  overflow-x:auto;scrollbar-width:none;
}
.char-status-bar::-webkit-scrollbar{display:none}
.char-status-chip{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:14px;font-size:11px;
  background:var(--bg2);cursor:pointer;
  white-space:nowrap;transition:background .2s;
}
.char-status-chip:hover{background:var(--bg3)}
.char-status-chip .cs-avatar{font-size:16px;line-height:1}
.char-status-chip .cs-avatar{font-size:16px;line-height:1}
.char-status-chip .cs-name{font-weight:600;color:var(--text)}
.char-status-chip .cs-name{font-weight:600;color:var(--text)}
.char-status-chip .cs-act{color:var(--text2);max-width:140px;overflow:hidden;text-overflow:ellipsis}
.char-status-chip .cs-dwell{font-size:10px;color:var(--yellow)}
.char-status-chip.stale{background:#fff3e0} /* >8h dwell */

/* Character detail popup */
.char-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:var(--card);border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.15);width:280px;max-width:90vw;overflow:hidden;animation:popIn .2s ease-out}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(.9);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.char-popup .cp-head{display:flex;align-items:center;gap:10px;padding:14px 14px 0}
.char-popup .cp-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.char-popup .cp-title{flex:1}.char-popup .cp-name{font-size:15px;font-weight:700;color:var(--text)}
.char-popup .cp-mood{font-size:11px;color:var(--text2);margin-top:1px}
.char-popup .cp-close{width:24px;height:24px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;font-size:12px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.char-popup .cp-body{padding:10px 14px 14px}
.char-popup .cp-row{display:flex;gap:8px;padding:3px 0;font-size:12px;border-bottom:1px solid var(--bg2)}
.char-popup .cp-row:last-child{border:none}
.char-popup .cp-label{color:var(--text2);width:36px;flex-shrink:0}
.char-popup .cp-val{color:var(--text);flex:1}

.msg-list{
  flex:1;overflow-y:auto;padding:8px 12px;
  display:flex;flex-direction:column;gap:4px;
  -webkit-overflow-scrolling:touch;
  background:var(--bg);
}

/* Message row -- WeChat-style left/right layout */
.msg-row{
  display:flex;gap:8px;align-items:flex-start;
  animation:msgIn .28s ease-out;
  position:relative;
}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Self (user) — right side, reverse flex */
.msg-row.self{flex-direction:row-reverse}
.msg-row.self .msg-col{align-items:flex-end}
.msg-row.self .msg-bubble{
  border-radius:18px 4px 18px 18px;
}
.msg-row.self .msg-sender{text-align:right}

/* Other (character) — left side */
.msg-row.other{flex-direction:row}
.msg-row.other .msg-col{align-items:flex-start}
.msg-row.other .msg-bubble{
  border-radius:4px 18px 18px 18px;
}

/* Avatar */
.msg-avatar{
  width:38px;height:38px;min-width:38px;border-radius:50%;
  overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  background:#999 !important;
}
.msg-avatar img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.msg-avatar .avt-initial{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;
}

/* Column wrapper (bubble + time) */
.msg-col{
  display:flex;flex-direction:column;gap:1px;
  max-width:75%;min-width:0;
}

/* Sender name above bubble */
.msg-sender{
  font-size:11px;font-weight:600;color:var(--text2);
  padding:0 6px;margin-bottom:2px;
}

/* Bubble -- warm card background */
.msg-bubble{
  display:inline-block;max-width:100%;
  padding:10px 14px;
  font-size:14px;line-height:1.5;word-break:break-word;
  white-space:pre-wrap;
  background:var(--card);
  color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,.04);
  position:relative;
}

/* Image bubble */
.msg-bubble.img-bubble{
  padding:3px;overflow:hidden;
  position:relative;
  min-width:206px;min-height:156px;
  border-radius:8px 18px 18px 18px;
}
.msg-row.self .msg-bubble.img-bubble{
  border-radius:18px 8px 18px 18px;
}
.img-bubble img{
  width:100%;max-width:260px;max-height:260px;
  border-radius:5px;display:block;cursor:pointer;
  object-fit:cover;
  position:relative;z-index:1;
}
.img-bubble .img-skeleton{
  z-index:0;
}
.img-bubble .img-placeholder{
  width:180px;height:140px;display:flex;align-items:center;justify-content:center;
  background:var(--bg2);border-radius:5px;color:var(--text2);font-size:13px;
}

/* Voice bubble */
.msg-bubble.voice-bubble{
  display:flex;align-items:center;gap:8px;
  cursor:pointer;min-width:100px;
}
.voice-bubble .play-icon{font-size:20px;line-height:1}
.voice-bar{
  width:80px;height:6px;border-radius:3px;background:var(--bg3);
  overflow:hidden;flex-shrink:0;
}
.voice-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .1s linear}

/* Time stamp under bubble */
.msg-time{
  font-size:10px;color:var(--text2);padding:0 6px;opacity:.7;
}

/* Time divider between message groups */
.time-divider{
  text-align:center;margin:10px 0 6px;
}
.time-divider span{
  font-size:10px;color:var(--text2);background:rgba(0,0,0,.04);
  padding:2px 10px;border-radius:10px;display:inline-block;
}

/* Typing indicator */
.msg-typing{
  display:flex;align-items:center;gap:10px;padding:4px 0;
  font-size:12px;color:var(--text2);
}
.typing-dots{display:flex;gap:4px}
.typing-dots span{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  animation:typingBounce 1.4s ease-in-out infinite;
}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}
@keyframes typingBounce{
  0%,80%,100%{opacity:.25;transform:translateY(0)}
  40%{opacity:1;transform:translateY(-6px)}
}

/* Delete button — appears on context menu or long press */
.msg-action-overlay{
  position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
}
.msg-action-menu{
  background:rgba(255,255,255,.96);border-radius:14px;
  padding:8px 0;min-width:180px;overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,.2);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.msg-action-item{
  display:flex;align-items:center;gap:10px;
  padding:14px 24px;font-size:15px;color:var(--text);
  cursor:pointer;border:none;background:none;width:100%;text-align:left;
  transition:background .1s;
}
.msg-action-item:active{background:rgba(0,0,0,.06)}
.msg-action-item .icon{font-size:18px;width:24px;text-align:center}
.msg-action-item.danger{color:var(--red)}
.msg-action-item + .msg-action-item{border-top:1px solid rgba(0,0,0,.06)}

/* Multi-select mode */
.msg-checkbox{
  width:22px;height:22px;border-radius:50%;
  border:2px solid rgba(0,0,0,.2);background:#fff;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;
}
.msg-checkbox.checked{
  border-color:var(--accent);background:var(--accent);
}
.msg-checkbox.checked::after{
  content:"✓";color:#fff;font-size:13px;font-weight:700;
}
.multi-select-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:250;
  background:var(--card);border-top:1px solid rgba(0,0,0,.08);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 -4px 20px rgba(0,0,0,.08);
  transform:translateY(100%);transition:transform .25s ease;
}
.multi-select-bar.active{transform:translateY(0)}
.multi-select-bar .sel-count{flex:1;font-size:14px;color:var(--text2)}
.multi-select-bar .sel-count strong{color:var(--text)}
.multi-select-bar .ms-btn{
  padding:8px 20px;border-radius:20px;border:none;font-size:14px;cursor:pointer;
  transition:opacity .15s;
}
.multi-select-bar .ms-btn:active{opacity:.7}
.multi-select-bar .ms-btn-primary{background:var(--accent);color:#fff}
.multi-select-bar .ms-btn-danger{background:var(--red);color:#fff}
.multi-select-bar .ms-btn-cancel{background:var(--bg3);color:var(--text)}
.msg-row.multi-select-mode{padding-left:8px}
.msg-row.multi-select-mode .msg-checkbox-wrap{
  display:flex;align-items:flex-start;padding-top:14px;margin-right:6px;
}
.msg-row.multi-select-mode .msg-checkbox-wrap{display:flex}
.msg-row .msg-checkbox-wrap{display:none}
.msg-row.selected{background:rgba(254,169,130,.08);border-radius:8px}
.msg-delete-dialog{
  background:var(--card);border-radius:14px;padding:20px 24px;
  text-align:center;min-width:200px;box-shadow:0 8px 32px rgba(0,0,0,.15);
}
.msg-delete-dialog p{font-size:14px;margin-bottom:16px;color:var(--text)}
.msg-delete-dialog .dd-btns{display:flex;gap:10px;justify-content:center}
.msg-delete-dialog .dd-btns button{
  padding:8px 24px;border-radius:20px;border:none;font-size:14px;cursor:pointer;
}
.dd-btn-cancel{background:var(--bg3);color:var(--text)}
.dd-btn-confirm{background:var(--red);color:#fff}
/* Chat input bar */
.chat-input-bar{
  display:flex;gap:8px;padding:10px 12px;
  background:var(--card);border-top:1px solid rgba(0,0,0,.05);
  align-items:center;flex-shrink:0;
  padding-bottom:calc(10px + var(--safe-bottom));
}
.chat-input-bar input{
  flex:1;min-width:0;padding:10px 16px;
  border-radius:24px;border:1.5px solid rgba(0,0,0,.07);
  background:var(--bg3);color:var(--text);font-size:16px;
  outline:none;transition:border-color .2s;
  min-height:44px;
}
.chat-input-bar input:focus{border-color:var(--accent)}
.send-btn{
  width:44px;height:44px;min-width:44px;border-radius:50%;
  border:none;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .2s,transform .15s;
  box-shadow:0 2px 8px rgba(254,169,130,.3);
}
.send-btn:active{transform:scale(.9)}
.send-btn:disabled{opacity:.4}

/* Chat header clear button */
.chat-clear-btn{
  background:none;border:1px solid rgba(0,0,0,.1);color:var(--text2);
  padding:4px 12px;border-radius:14px;font-size:12px;cursor:pointer;
  transition:all .15s;
}
.chat-clear-btn:active{background:rgba(0,0,0,.05)}

/* ═══════════════════════════════════════════
   Map Tab Styles
   ═══════════════════════════════════════════ */
.map-container{
  position:relative;width:100%;aspect-ratio:1000/720;
  background:var(--bg);border-radius:var(--radius);
  overflow:hidden;border:1px solid rgba(0,0,0,.05);
  flex-shrink:0;
  touch-action:none;
}

/* Character pin on map -- bounce landing + pulse ring */
.map-pin{
  position:absolute;z-index:10;
  transform:translate(-50%,-50%);
  cursor:pointer;
  transition:transform .15s,z-index 0s;
  pointer-events:auto;
  touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;
  width:64px;
}
.map-pin .map-pin-label{text-align:center;width:auto;max-width:64px;overflow:hidden;text-overflow:ellipsis}
.map-pin-avatar{
  width:40px;height:40px;border-radius:50%;
  overflow:hidden;border:3px solid #fff;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;
  box-shadow:0 3px 14px rgba(0,0,0,.22);
  transition:transform .2s cubic-bezier(0.16, 1, 0.3, 1),box-shadow .2s;
  position:relative;z-index:2;
}
.map-pin:active .map-pin-avatar{
  transform:scale(1.8);
  box-shadow:0 6px 24px rgba(0,0,0,.35);
  z-index:50;
}

/* Pin drop landing animation */
.map-pin.just-arrived .map-pin-avatar{
  animation:pinDrop .5s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes pinDrop{
  0%   {transform:translateY(-60px);opacity:0}
  60%  {transform:translateY(6px);opacity:1}
  80%  {transform:translateY(-3px)}
  100% {transform:translateY(0)}
}

/* Pin idle float */
.map-pin.idle .map-pin-avatar{
  animation:pinFloat 3s ease-in-out infinite;
}
@keyframes pinFloat{
  0%,100%{transform:translateY(0)}
  50%    {transform:translateY(-4px)}
}

/* Pulse ring around pin -- hidden per Bug 3 */
.map-pin-ring{
  display:none!important;
  position:absolute;top:50%;left:50%;
  width:48px;height:48px;
  transform:translate(-50%,-50%);
  border-radius:50%;border:2.5px solid var(--accent);
  animation:pinPulse 2.5s ease-in-out infinite;
  pointer-events:none;
}
.poi-icon{font-size:16px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));position:relative}
/* Traveling pin -- dashed ring + blue glow */
.map-pin.traveling .map-pin-ring{
  display:none!important;
  border-style:dashed;border-color:var(--accent2);
  animation:pinPulseFast 1.2s ease-in-out infinite;
}
.map-pin.traveling .map-pin-avatar{
  border-color:var(--accent2);
  box-shadow:0 0 16px rgba(112,199,226,.35);
}
@keyframes pinPulseFast{
  0%   {transform:translate(-50%,-50%) scale(.9);opacity:.7}
  100% {transform:translate(-50%,-50%) scale(1.5);opacity:0}
}

/* Map info card (detail popup) */
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.map-info-hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.map-info-avt{
  width:48px;height:48px;border-radius:50%;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;
}
.map-info-avt img{width:100%;height:100%;object-fit:cover}
.map-info-name{font-size:16px;font-weight:700}
.map-info-meta{font-size:12px;color:var(--text2)}
.map-info-section{margin-top:8px}
.map-info-section h4{font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.map-info-section p{font-size:13px;line-height:1.5}
.map-photo-grid{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.map-photo-grid .photo-item{
  flex:0 0 100px;width:100px;height:100px;border-radius:8px;overflow:hidden;
  background:#f5f5f5;position:relative;
}
.map-photo-grid .photo-item img{
  width:100px;height:100px;border-radius:var(--radius-sm);
  object-fit:cover;cursor:pointer;display:block;visibility:visible;opacity:1;
  border:1px solid rgba(0,0,0,.05);
  transition:transform .15s;
}
.map-photo-grid .photo-item img:active{transform:scale(.95)}
.map-photo-grid .photo-del-btn{
  position:absolute;top:2px;right:2px;z-index:5;
  width:20px;height:20px;border-radius:50%;border:none;
  background:rgba(0,0,0,.5);color:#fff;font-size:11px;line-height:20px;
  text-align:center;cursor:pointer;display:none;
  padding:0;transition:background .15s;
}
.map-photo-grid .photo-item:hover .photo-del-btn,
.map-photo-grid .photo-item .photo-del-btn:focus{display:block}
.map-photo-grid .photo-del-btn:hover{background:rgba(200,30,30,.8)}
.photo-item-loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#f5f5f5;border-radius:8px;font-size:12px;color:#bbb;
}

/* Photo upload button */
.upload-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:50%;
  border:2px dashed rgba(0,0,0,.10);background:rgba(0,0,0,.03);
  color:var(--text2);font-size:18px;cursor:pointer;transition:.2s;
  vertical-align:middle;margin-left:6px;line-height:1;
}
.upload-btn:hover,.upload-btn:active{
  border-color:var(--accent);color:var(--accent);
  background:rgba(254,169,130,.12);
}

/* ═══════════════════════════════════════════
   Map POI Overlays
   ═══════════════════════════════════════════ */
.poi-home{/* home marker -- slightly larger ring pulse */}

.poi,.poi-sm,.poi-lg{
  position:absolute;z-index:10;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:transform .2s cubic-bezier(0.16, 1, 0.3, 1),z-index 0s;
  pointer-events:auto;
  touch-action:manipulation;
  min-width:44px;min-height:44px;
  justify-content:center;
}
.poi:active,.poi-sm:active,.poi-lg:active{transform:translate(-50%,-50%) scale(1.25);z-index:50}
.poi-icon{font-size:16px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));position:relative}
/* Ghost pseudo-element to expand touch area without changing visuals */
.poi-icon::after{
  content:'';position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:44px;height:44px;
}
.poi-lg .poi-icon{font-size:20px}
.poi-lg img{display:block;max-width:48px;max-height:48px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3));border-radius:8px;pointer-events:auto}
@media (max-width:768px){.poi-lg img{max-width:32px;max-height:32px}.poi-lg-name{font-size:8px}}
.poi-sm .poi-icon{font-size:13px}
.poi-name,.poi-lg-name{
  font-size:8px;text-align:center;white-space:nowrap;
  color:var(--text);font-weight:600;
  margin-top:1px;background:rgba(0,0,0,.04);
  padding:1px 6px;border-radius:6px;
  text-shadow:none;line-height:1.4;
  pointer-events:none;
}
.poi-lg-name{font-size:10px;padding:1px 6px;background:rgba(0,0,0,.05)}
.poi-lg-sub{font-size:7px;color:var(--text2);display:block;font-weight:400}
.poi-sm .poi-name{font-size:7px;padding:1px 4px}

/* Compact dot POI -- icon only, label pops on tap */
.poi-dot{
  position:absolute;z-index:8;
  transform:translate(-50%,-50%);
  font-size:14px;cursor:pointer;
  transition:transform .15s;
  pointer-events:auto;
  touch-action:manipulation;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.15));
  min-width:44px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
}
.poi-dot:active{transform:translate(-50%,-50%) scale(1.4);z-index:50}

/* POI tap ripple animation */
.poi-tap-ripple{
  position:absolute;
  width:20px;height:20px;
  border-radius:50%;
  background:rgba(254,169,130,.35);
  pointer-events:none;
  animation:poiRipple .5s ease-out forwards;
}
@keyframes poiRipple{
  0%   {transform:translate(-50%,-50%) scale(.3);opacity:.7}
  100% {transform:translate(-50%,-50%) scale(3);opacity:0}
}

/* Road labels */
.road-label{
  position:absolute;z-index:2;pointer-events:none;
  font-size:7px;color:rgba(0,0,0,.22);
  font-weight:600;white-space:nowrap;
  text-shadow:0 0 3px rgba(249,243,230,.8);
  font-family:sans-serif;
}
.road-label.main{font-size:9px;color:rgba(0,0,0,.28)}

/* Metro labels */
.metro-label{
  position:absolute;z-index:3;pointer-events:none;
  font-size:8px;color:#7b6b92;font-weight:600;
  text-shadow:0 0 3px rgba(249,243,230,.7);
}
.metro-info{
  position:absolute;z-index:2;pointer-events:none;
  font-size:6px;color:rgba(0,0,0,.18);
  white-space:nowrap;
}

/* Goal progress bar */
.goal-bar{
  width:100%;height:6px;border-radius:3px;
  background:rgba(0,0,0,.06);
  margin-top:6px;overflow:hidden;
}
.goal-bar-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#ff8052,#ff9980,#ffb3b3);
  transition:width .6s ease;
  position:relative;
}
/* Glow dot at the end of goal bar */
.goal-bar-fill::after{
  content:'';position:absolute;
  right:0;top:50%;transform:translateY(-50%);
  width:8px;height:8px;border-radius:50%;
  background:#fff;opacity:.6;
  box-shadow:0 0 6px rgba(254,169,130,.5);
}
.goal-label{
  font-size:10px;color:var(--text2);
  display:flex;justify-content:space-between;
  margin-top:2px;
}

/* Weather badge on map */
.weather-badge{
  position:absolute;z-index:20;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(16px) saturate(1.4);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.6);
  border-radius:20px;padding:5px 12px;
  font-size:12px;font-weight:600;
  color:var(--text);
  box-shadow:0 2px 12px rgba(0,0,0,.06);
  pointer-events:none;line-height:1.5;
}

/* Travel indicator on map pin (ring hidden) */
.map-pin.traveling .map-pin-ring{
  display:none!important;
  animation:travelPulse 1s ease-in-out infinite;
  border-style:dashed;
}
@keyframes travelPulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}
  50%    {transform:translate(-50%,-50%) scale(1.5);opacity:.2}
}

/* Travel path dashed flow */
.travel-path{
  animation:dashFlow 1.5s linear infinite;
  stroke-linecap:round;
}
@keyframes dashFlow{
  to{stroke-dashoffset:-100}
}

/* Full image modal */
.img-modal{
  position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.94);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;
  animation:fadeIn .2s ease;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.img-modal img{width:90vw;max-width:95vw;max-height:85vh;object-fit:contain;display:block;animation:fadeIn .3s ease;transition:filter 0.5s ease}
.img-modal .modal-spinner{
  width:36px;height:36px;border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.img-modal .close-btn{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  width:44px;height:44px;border-radius:50%;
  border:none;background:rgba(255,255,255,.15);
  color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.img-modal .modal-err{
  color:rgba(255,255,255,.6);font-size:14px;display:none;
}

/* ═══════════════════════════════════════════
   Map Time-of-Day Overlays
   ═══════════════════════════════════════════ */
.time-dawn{
  background:linear-gradient(135deg, rgba(254,169,130,.10), rgba(255,180,150,.06))!important;
}
.time-morning{
  background:linear-gradient(135deg, rgba(112,199,226,.06), rgba(160,220,240,.04))!important;
}
.time-noon{
  background:transparent!important;
}
.time-afternoon{
  background:linear-gradient(135deg, rgba(245,175,25,.07), rgba(241,100,50,.04))!important;
}
.time-dusk{
  background:linear-gradient(135deg, rgba(254,169,130,.10), rgba(160,140,180,.08))!important;
}
.time-night{
  background:linear-gradient(135deg, rgba(58,37,34,.12), rgba(74,53,48,.08))!important;
}

/* ═══════════════════════════════════════════
   Characters Tab Styles
   ═══════════════════════════════════════════ */
.char-grid{display:flex;flex-direction:column;gap:10px}
.char-card{
  background:var(--card);border-radius:var(--radius);
  border:1px solid rgba(0,0,0,.05);
  overflow:hidden;
  transition:border-color .25s ease,box-shadow .25s ease;
  box-shadow:0 1px 4px rgba(0,0,0,.03);
}
.char-card.expanded{
  border-color:rgba(254,169,130,.25);
  box-shadow:0 4px 24px rgba(254,169,130,.08);
}

.char-card-hd{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;cursor:pointer;
  min-height:72px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.char-card-hd:active{background:rgba(0,0,0,.02)}

.char-card-avatar{
  width:48px;height:48px;min-width:48px;border-radius:50%;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;
  position:relative;
}
.char-card-avatar img{width:100%;height:100%;object-fit:cover}
.char-card-info{flex:1;min-width:0}
.char-card-name{
  font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.char-card-name .online-dot{
  width:10px;height:10px;border-radius:50%;
  position:relative;
}
.char-card-name .online-dot.on{
  background:var(--green);
  box-shadow:0 0 0 0 rgba(93,168,138,.4);
  animation:onlinePulse 3s ease-in-out infinite;
}
@keyframes onlinePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(93,168,138,.4)}
  50%    {box-shadow:0 0 0 6px rgba(93,168,138,0)}
}
.char-card-name .online-dot.off{
  background:#b0a89e;
  box-shadow:none;
}
.char-card-activity{font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Expand arrow -- spring rotation */
.char-card-arrow{
  color:var(--text2);font-size:12px;
  transition:transform .3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.char-card.expanded .char-card-arrow{transform:rotate(180deg)}

/* Pleasure bar in card header -- warm coral gradient */
.pleasure-mini{
  height:5px;border-radius:3px;background:var(--bg3);
  margin-top:6px;overflow:hidden;
}
.pleasure-mini-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--accent),#ffcdb2);
  transition:width .8s cubic-bezier(0.22, 0.61, 0.36, 1);
  position:relative;
}
.pleasure-mini-fill::after{
  content:'';position:absolute;
  right:0;top:50%;transform:translateY(-50%);
  width:6px;height:6px;border-radius:50%;
  background:#fff;opacity:.6;
  box-shadow:0 0 4px rgba(254,169,130,.5);
}

/* Expanded control panel -- grid-template-rows animation */
.char-ctrl-panel{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .35s ease;
  border-top:1px solid transparent;
}
.char-card.expanded .char-ctrl-panel{
  grid-template-rows:1fr;
  border-top-color:rgba(0,0,0,.05);
}
.char-ctrl-inner{
  overflow:hidden;
  padding:0;
}
.char-card.expanded .char-ctrl-inner{
  padding:12px 14px;
  display:flex;flex-direction:column;gap:10px;
}

/* Control section */
.ctrl-section{background:var(--bg2);border-radius:var(--radius-sm);padding:10px 12px}
.ctrl-section-title{font-size:11px;color:var(--text2);margin-bottom:8px;font-weight:500}

/* Zone buttons -- warmer active state */
.zone-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;touch-action:manipulation}
.zone-btn{
  flex:1;min-width:44px;min-height:42px;
  padding:8px 6px;border-radius:24px;
  border:1.5px solid rgba(0,0,0,.08);
  background:transparent;color:var(--text2);
  font-size:12px;cursor:pointer;transition:all .2s ease;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  -webkit-tap-highlight-color:transparent;
}
.zone-btn .zone-emoji{font-size:16px;line-height:1}
.zone-btn.active{
  background:linear-gradient(135deg,#FEA982,#ff9eb5);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(254,169,130,.25);
}
.zone-btn:active{
  transform:scale(.96);
  background:rgba(254,169,130,.06);
}
/* High intensity zone */
.zone-btn.intense{border-color:rgba(224,85,106,.20)}
.zone-btn.intense.active{
  border-color:var(--red);
  background:linear-gradient(135deg, rgba(224,85,106,.12), rgba(224,85,106,.04));
  color:var(--red);
}

/* Intensity slider -- enlarged thumb for finger */
.slider-wrap{margin:8px 0}
.slider-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:6px}
input[type=range]{
  width:100%;height:8px;-webkit-appearance:none;appearance:none;
  background:linear-gradient(90deg,#f8d8e0,#f0a0b8,#e87090,#d04060);
  border-radius:4px;outline:none;
  touch-action:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:44px;height:44px;border-radius:50%;
  background:#fff;border:3px solid #FEA982;
  cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;
  box-shadow:0 2px 8px rgba(254,169,130,.4);
}
input[type=range]::-webkit-slider-thumb:active{
  transform:scale(1.15);
  box-shadow:0 4px 16px rgba(254,169,130,.5);
}
input[type=range]::-moz-range-thumb{
  width:44px;height:44px;border-radius:50%;
  background:#fff;border:3px solid #FEA982;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(254,169,130,.35);
}

/* Action buttons */
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn{
  padding:8px 16px;border-radius:var(--radius-sm);
  border:none;font-size:13px;font-weight:600;cursor:pointer;
  transition:opacity .2s,transform .15s,box-shadow .15s;
  min-height:44px;display:inline-flex;align-items:center;gap:4px;
  white-space:nowrap;
}
.btn:active{transform:scale(.96)}
.btn-primary{
  background:linear-gradient(135deg,#FEA982,#ff9eb5);
  color:#fff;
  box-shadow:0 2px 8px rgba(254,169,130,.35);
}
.btn-danger{background:#e0556a;color:#fff;box-shadow:0 2px 8px rgba(224,85,106,.3)}
.btn-outline{background:transparent;border:1px solid rgba(0,0,0,.10);color:var(--text)}
.btn-outline.active{
  background:linear-gradient(135deg,#FEA982,#ff9eb5);
  border-color:var(--accent);color:#fff;
}
.btn-sm{padding:6px 12px;font-size:12px;min-height:36px}
.btn-warn{
  background:rgba(212,165,70,.12);color:#b8860b;
  border:1px solid rgba(212,165,70,.2);
}

/* Overstim warning bar -- three levels */
.overstim-bar{
  padding:10px 14px;border-radius:var(--radius-sm);
  font-size:12px;text-align:center;display:none;
  transition:all .3s ease;line-height:1.5;
}
.overstim-bar.warn{
  background:linear-gradient(135deg, rgba(254,169,130,.12), rgba(255,158,181,.05));
  color:#c0774a;border:1px solid rgba(254,169,130,.3);
  display:block;
}
.overstim-bar.danger{
  background:linear-gradient(135deg, rgba(224,85,106,.12), rgba(224,85,106,.05));
  color:#d04060;border:1px solid rgba(224,85,106,.3);
  display:block;
  animation:dangerGlow 2s ease-in-out infinite;
}
@keyframes dangerGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(224,85,106,.15)}
  50%    {box-shadow:0 0 12px 3px rgba(224,85,106,.08)}
}
.overstim-bar.critical{
  background:linear-gradient(135deg, rgba(200,60,90,.18), rgba(180,20,20,.08));
  color:#b71c1c;border:1px solid rgba(224,85,106,.4);
  display:block;font-weight:600;
  animation:criticalPulse 1s ease-in-out infinite;
}
@keyframes criticalPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%    {opacity:.75;transform:scale(1.02)}
}

/* Toy selection grid */
.toy-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(80px, 1fr));
  gap:8px;
}
.toy-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 6px;border-radius:var(--radius-sm);
  border:1.5px solid rgba(0,0,0,.06);
  background:var(--bg);
  cursor:pointer;transition:all .2s ease;
  text-align:center;min-height:64px;justify-content:center;
}
.toy-item .toy-icon{font-size:24px;line-height:1;transition:transform .2s ease}
.toy-item .toy-name{font-size:10px;color:var(--text2)}
.toy-item.active{
  border-color:var(--accent);
  background:rgba(254,169,130,.06);
  box-shadow:0 2px 8px rgba(254,169,130,.12);
}
.toy-item.active .toy-icon{transform:scale(1.15)}
.toy-item:active{transform:scale(.95);background:rgba(254,169,130,.04)}

/* Status display */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.status-item{display:flex;gap:4px}
.status-lbl{color:var(--text2)}

/* Mood / status capsule tags */
.mood-tag{
  font-size:10px;padding:2px 10px;border-radius:10px;
  font-weight:500;white-space:nowrap;
  border:1px solid;line-height:1.4;
}
.mood-tag.flirty  {color:var(--accent);background:rgba(254,169,130,.08);border-color:rgba(254,169,130,.2)}
.mood-tag.playful {color:var(--yellow);background:rgba(212,165,70,.08);border-color:rgba(212,165,70,.2)}
.mood-tag.shy     {color:#c78bb3;background:rgba(199,139,179,.08);border-color:rgba(199,139,179,.2)}
.mood-tag.relaxed {color:var(--accent2);background:rgba(112,199,226,.08);border-color:rgba(112,199,226,.2)}
.mood-tag.excited {color:var(--red);background:rgba(224,85,106,.08);border-color:rgba(224,85,106,.2)}

/* ═══════════════════════════════════════════
   World Tab Styles
   ═══════════════════════════════════════════ */

.world-card{
  background:var(--card);border-radius:var(--radius);
  border:1px solid rgba(0,0,0,.05);
  padding:14px;margin-bottom:10px;
}
.world-card h3{font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:6px}
.world-card h3 .icon{font-size:16px}

/* Weather */
.weather-row{display:flex;gap:12px;align-items:center}
.weather-icon{font-size:40px}
.weather-info{flex:1}
.weather-temp{font-size:24px;font-weight:700}
.weather-desc{font-size:12px;color:var(--text2)}

/* Goals list */
.goal-item{
  display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid rgba(0,0,0,.03);
  font-size:13px;
}
.goal-item:last-child{border-bottom:none}
.goal-char-tag{
  font-size:10px;padding:2px 8px;border-radius:10px;
  font-weight:600;white-space:nowrap;flex-shrink:0;
}
.goal-text{flex:1;line-height:1.4}
.goal-progress{font-size:10px;color:var(--text2);flex-shrink:0}

/* Timeline */
.timeline-item{
  display:flex;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(0,0,0,.03);
  font-size:12px;
}
.timeline-time{color:var(--text2);min-width:50px;flex-shrink:0;padding-top:1px}
.timeline-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0}
.timeline-content{flex:1;line-height:1.5}

/* Goal progress bar */
.goal-bar-wrap{margin-top:4px;height:4px;border-radius:2px;background:var(--bg3);overflow:hidden}

/* ═══════════════════════════════════════════
   Daily Records -- 色色记录 cards
   ═══════════════════════════════════════════ */
.records-section{margin-top:4px}
.records-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.records-title h3{font-size:14px;color:var(--text);font-weight:600;display:flex;align-items:center;gap:6px}
.records-count{font-size:11px;color:var(--text2)}

.record-card{
  background:linear-gradient(135deg,rgba(254,169,130,.06),rgba(112,199,226,.04));
  border:1px solid rgba(254,169,130,.12);
  border-radius:var(--radius);
  padding:14px;margin-bottom:10px;
  cursor:pointer;transition:border-color .2s,background .2s;
  position:relative;overflow:hidden;
}
/* Left color bar */
.record-card::before{
  content:'';position:absolute;top:0;left:0;width:4px;height:100%;
  background:linear-gradient(180deg,var(--accent),var(--accent2));
  border-radius:4px 0 0 4px;
}
.record-card:active{
  background:rgba(254,169,130,.10);
  border-color:var(--accent);
}
.record-card.expanded{
  border-color:var(--accent);
  background:rgba(254,169,130,.10);
}

.record-card-hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.record-date{
  font-size:11px;color:var(--text2);
  background:rgba(0,0,0,.04);padding:2px 8px;border-radius:8px;
  white-space:nowrap;flex-shrink:0;
}
.record-title-text{font-size:14px;font-weight:700;color:var(--text);flex:1}
.record-level{
  font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;
  text-transform:uppercase;flex-shrink:0;
}
.record-level.heavy{background:rgba(255,68,102,.2);color:var(--red)}
.record-level.moderate{background:rgba(255,200,80,.15);color:var(--yellow)}
.record-level.light{background:rgba(80,224,144,.15);color:var(--green)}

.record-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.record-char-tag{
  font-size:10px;padding:1px 8px;border-radius:8px;
  font-weight:500;border:1px solid;
}
.record-highlight-tag{
  font-size:10px;padding:1px 8px;border-radius:8px;
  background:rgba(254,169,130,.10);color:var(--accent);
}

.record-summary{
  font-size:12px;color:var(--text2);line-height:1.6;
  margin-top:6px;display:none;
  max-height:80px;overflow:hidden;position:relative;
}
.record-summary::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:20px;
  background:linear-gradient(transparent,var(--card));
}
.record-card.expanded .record-summary{display:block}
.record-expand-hint{
  font-size:10px;color:var(--accent);text-align:right;
  opacity:.7;margin-top:4px;
}
.record-card.expanded .record-expand-hint{color:var(--text2)}
.record-card.expanded .record-expand-hint::after{content:' 收起 ▲'}
.record-card:not(.expanded) .record-expand-hint::after{content:'展开查看 ▼'}

/* Full diary modal */
.record-modal-overlay{
  position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.85);
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s ease;
}
.record-modal-box{
  background:var(--bg2);border:1px solid rgba(254,169,130,.15);
  border-radius:var(--radius);padding:20px;
  width:92vw;max-width:480px;max-height:85vh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.record-modal-box h2{font-size:16px;margin-bottom:8px;color:var(--accent)}
.record-modal-meta{font-size:11px;color:var(--text2);margin-bottom:14px}
.record-modal-body{
  font-size:14px;line-height:1.8;color:var(--text);
  white-space:pre-wrap;word-break:break-word;
}
.record-modal-close{
  position:sticky;top:0;float:right;
  width:32px;height:32px;border-radius:50%;
  border:none;background:rgba(0,0,0,.05);
  color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:1;
}
.record-load-more{
  display:block;width:100%;padding:10px;margin-top:4px;
  border-radius:var(--radius-sm);
  border:1px solid rgba(0,0,0,.07);
  background:transparent;color:var(--text2);font-size:13px;
  cursor:pointer;text-align:center;transition:.2s;
}
.record-load-more:active{background:var(--card-hover);color:var(--text)}
.record-load-more:disabled{opacity:.4}

/* ═══════════════════════════════════════════
   Shared: Toast, Modal, Empty state
   ═══════════════════════════════════════════ */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid rgba(0,0,0,.07);
  padding:10px 24px;border-radius:24px;font-size:13px;
  box-shadow:var(--shadow);z-index:300;
  opacity:0;pointer-events:none;transition:opacity .3s;
  white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
  color:var(--text);
}
.toast.show{opacity:1}

.decision-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s ease;
}
.decision-box{
  background:var(--card);border:1px solid rgba(0,0,0,.07);
  border-radius:var(--radius);padding:20px;max-width:360px;width:90%;
  box-shadow:var(--shadow);
}
.decision-box h3{font-size:15px;margin-bottom:14px}
.decision-choices{display:flex;flex-direction:column;gap:8px}
.decision-choice{
  padding:10px 16px;border-radius:var(--radius-sm);
  border:1px solid rgba(0,0,0,.07);
  background:transparent;color:var(--text);font-size:13px;
  cursor:pointer;text-align:left;transition:.15s;
}
.decision-choice:active{background:var(--card-hover);border-color:var(--accent)}
.decision-choice .effect{display:block;font-size:11px;color:var(--text2);margin-top:2px}
.decision-input-row{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.06)}
.decision-input-row input{
  flex:1;padding:8px 12px;border-radius:var(--radius-sm);
  border:1px solid rgba(0,0,0,.07);
  background:var(--bg);color:var(--text);font-size:13px;outline:none;min-height:44px;
}
.decision-input-row input:focus{border-color:var(--accent)}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.6}

/* ═══════════════════════════════════════════
   Scrollbar -- warm tones
   ═══════════════════════════════════════════ */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--accent);opacity:.4}

/* ═══════════════════════════════════════════
   Weather Overlay Effects (map)
   ═══════════════════════════════════════════ */
.weather-overlay{
  position:absolute;inset:0;
  pointer-events:none;z-index:5;
}
/* Rain effect */
.weather-overlay.rain::before{
  content:'';position:absolute;inset:-20px;
  background:repeating-linear-gradient(
    105deg,
    transparent,transparent 8px,
    rgba(174,194,224,.10) 8px,
    rgba(174,194,224,.10) 9px
  );
  animation:rainFall .6s linear infinite;
}
.weather-overlay.rain::after{
  content:'';position:absolute;inset:-20px;
  background:repeating-linear-gradient(
    100deg,
    transparent,transparent 12px,
    rgba(174,194,224,.06) 12px,
    rgba(174,194,224,.06) 14px
  );
  animation:rainFall .9s linear infinite;
}
@keyframes rainFall{
  to{transform:translateY(20px) translateX(-5px)}
}
/* Fog effect */
.weather-overlay.fog{
  background:
    radial-gradient(ellipse at 30% 40%, rgba(220,215,205,.3), transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(210,205,195,.25), transparent 50%);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  animation:fogDrift 8s ease-in-out infinite;
}
@keyframes fogDrift{
  0%,100%{transform:translateX(0)}
  50%    {transform:translateX(10px)}
}
/* Sunny effect */
.weather-overlay.sunny{
  background:linear-gradient(
    180deg,
    rgba(255,240,220,.12) 0%,
    rgba(255,235,200,.06) 50%,
    transparent 100%
  );
  animation:sunShimmer 4s ease-in-out infinite;
}
@keyframes sunShimmer{
  0%,100%{opacity:.8}
  50%    {opacity:1}
}

/* ═══════════════════════════════════════════
   Map Bottom Sheet Backdrop
   ═══════════════════════════════════════════ */
.map-sheet-backdrop{
  position:fixed;inset:0;z-index:90;
  background:rgba(0,0,0,.35);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
.map-sheet-backdrop.visible{
  opacity:1;pointer-events:auto;
}

/* ═══════════════════════════════════════════
   Goal bar complete flash
   ═══════════════════════════════════════════ */
.goal-bar-fill.complete{
  background:linear-gradient(90deg, var(--green), #7ecba0);
  animation:goalComplete .8s ease;
}
@keyframes goalComplete{
  0%   {filter:brightness(1.5)}
  100% {filter:brightness(1)}
}

/* ═══════════════════════════════════════════
   High pleasure glow effect
   ═══════════════════════════════════════════ */
.pleasure-mini-fill.high{
  animation:pleasureGlow 2s ease-in-out infinite;
}
@keyframes pleasureGlow{
  0%,100%{filter:brightness(1)}
  50%    {filter:brightness(1.15)}
}

/* ═══════════════════════════════════════════
   Scene Panel Styles
   ═══════════════════════════════════════════ */
.scene-stat{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);}
.stat-bar-bg{width:80px;height:6px;border-radius:3px;background:var(--bg3);}
.stat-bar-fill{height:100%;border-radius:3px;transition:width .5s ease;}
@keyframes sceneSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.scene-choice-btn{
  display:block;width:100%;padding:12px 16px;border-radius:var(--radius);
  background:var(--card);border:1px solid rgba(0,0,0,.06);
  font-size:14px;text-align:left;cursor:pointer;color:var(--text);
  transition:transform .15s,background .15s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.scene-choice-btn:active{transform:scale(.97);background:var(--card-hover);}

</style>
</head>
<body>

<div id="jsErr" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:red;color:#fff;font-size:10px;padding:4px 8px;display:none;white-space:pre-line"></div>
<script>
window.onerror=function(m,s,l,c,e){
  var el=document.getElementById('jsErr');
  if(el){el.style.display='block';el.innerHTML='JS ERR L'+l+':'+c+' '+m;}
};
window.addEventListener('unhandledrejection',function(e){
  var el=document.getElementById('jsErr');
  if(el){el.style.display='block';el.innerHTML='PROMISE ERR: '+String(e.reason);}
});
</script>

<div class="app" id="app">

  <!-- ═══ TAB 1: CHAT ═══ -->
  <div class="page active" id="page-chat">
    <div class="chat-header">
      <h2>💬 江城聊天</h2>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="chat-clear-btn" onclick="clearChatHistory()" title="清空聊天记录">🗑 清空</button>
        <div class="conn-dot" id="connDot"></div>
        <span class="conn-label" id="connLabel">连接中...</span>
      </div>
    </div>
    <div class="char-status-bar" id="charStatusBar" style="display:none">
      <!-- Populated by refreshCharStatusBar() -->
    </div>
    <div class="msg-list" id="msgList">
      <div class="empty-state">
        <div class="empty-icon">💬</div>
        <p>欢迎来到江城<br>输入消息开始对话</p>
      </div>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="chatInput" placeholder="输入消息..." enterkeyhint="send" maxlength="500">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- ═══ TAB 2: MAP ═══ -->
  <div class="page" id="page-map">
    <!-- Map top bar removed -- weather badge handles time + weather display -->
    <div class="page-content" style="padding:0;overflow-y:auto;-webkit-overflow-scrolling:touch">
      <div class="map-container" id="mapContainer">
        <!-- SVG map rendered by JS -->
      </div>
      <div style="position:fixed;bottom:76px;right:12px;z-index:99">
        <button id="pinToggleBtn" onclick="togglePins()" style="background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.08);border-radius:20px;padding:6px 12px;font-size:11px;cursor:pointer;color:var(--text2)">👤 隐藏</button>
      </div>
      <div class="map-info-sheet" id="mapInfoCard"></div>
    </div>
  </div>

  <!-- ═══ TAB 3: CHARACTERS ═══ -->
  <div class="page" id="page-chars">
    <div class="chat-header">
      <h2>👤 角色控制</h2>
      <div style="font-size:11px;color:var(--text2)" id="charRefreshLabel">--</div>
    </div>
    <div class="page-content">
      <div class="char-grid" id="charGrid"></div>
    </div>
  </div>

  <!-- ═══ TAB 4: WORLD ═══ -->
  <div class="page" id="page-world">
    <div class="chat-header">
      <h2>🌍 江城世界</h2>
      <div style="font-size:11px;color:var(--text2)" id="worldTimeLabel">--</div>
    </div>
    <div class="page-content" id="worldContent">
      <div class="empty-state"><div class="empty-icon">🌍</div><p>加载世界数据中...</p></div>
    </div>
  </div>

  <!-- ═══ SCENE PANEL OVERLAY ═══ -->
  <div id="sceneOverlay" style="display:none;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column;">
    <div id="sceneHeader" style="padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,0,0,.05);background:rgba(255,251,247,.95);flex-shrink:0;">
      <span style="cursor:pointer;font-size:16px;padding:4px" onclick="document.getElementById('sceneOverlay').style.display='none'">‹ 返回</span>
      <span id="sceneTitle" style="font-size:15px;font-weight:600;"></span>
      <span id="sceneTime" style="font-size:11px;color:var(--text2);"><span style="cursor:pointer;color:var(--red)" onclick="endScene()">结束</span></span>
    </div>
    <div id="sceneContent" style="flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;">
      <!-- Stat bars -->
      <div id="sceneStats" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <div class="scene-stat" data-stat="stamina"><span>体力</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:100%;background:#5da88a"></div></div></div>
        <div class="scene-stat" data-stat="desire"><span>欲望</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:0%;background:#e0556a"></div></div></div>
        <div class="scene-stat" data-stat="efficiency"><span>效率</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:100%;background:#70C7E2"></div></div></div>
      </div>
      <!-- Scene image -->
      <div id="sceneImageArea" style="display:none;margin-bottom:16px;border-radius:var(--radius);overflow:hidden;">
        <div id="sceneImageLoading" style="display:none;text-align:center;padding:40px;background:var(--card);">
          <div class="scene-loading-spinner" style="width:48px;height:48px;border-radius:50%;border:4px solid var(--bg3);border-top-color:var(--accent);animation:sceneSpin .8s linear infinite;margin:0 auto 12px;"></div>
          <div id="sceneImageLoadingText" style="font-size:13px;color:var(--text2);"></div>
        </div>
        <img id="sceneImage" style="width:100%;display:none;border-radius:var(--radius);" onerror="this.style.display='none'">
      </div>
      <!-- Scene text (typewriter) -->
      <div id="sceneText" style="font-size:14px;line-height:1.8;color:var(--text);margin-bottom:20px;white-space:pre-wrap;"></div>
      <!-- Choice buttons -->
      <div id="sceneChoices" style="display:flex;flex-direction:column;gap:10px;"></div>
      <!-- Voice indicator -->
      <div id="sceneVoiceIndicator" style="display:none;text-align:center;padding:8px;margin-top:8px;font-size:12px;color:var(--text2);">
        🔊 [语音] <span id="sceneVoiceLabel"></span>
      </div>
    </div>
    <!-- Bottom: character portraits for scene -->
    <div id="sceneCharBar" style="position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--card);border-top:1px solid rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px;padding-bottom:var(--safe-bottom);">
    </div>
  </div>

  <!-- ═══ BOTTOM TAB BAR ═══ -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('chat')" id="tabBtn-chat">
      <span class="tab-icon">💬</span>聊天
      <span class="tab-badge" id="chatBadge"></span>
    </button>
    <button class="tab-btn" onclick="switchTab('map')" id="tabBtn-map">
      <span class="tab-icon">🗺️</span>地图
    </button>
    <button class="tab-btn" onclick="switchTab('chars')" id="tabBtn-chars">
      <span class="tab-icon">👤</span>角色
    </button>
    <button class="tab-btn" onclick="switchTab('world')" id="tabBtn-world">
      <span class="tab-icon">🌍</span>世界
    </button>
    <button class="tab-btn" onclick="showSceneSelect()" id="tabBtn-scene" id="tabBtn-scene">
      <span class="tab-icon">🏝️</span>场景
    </button>
  </nav>
</div>

<!-- Hidden file input for photo upload -->
<input type="file" id="photoUploadInput" accept="image/*" style="display:none" onchange="handleFileUpload(event)">

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// Register SW before app.js (isolated, won't block)
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
<script src="js/app.js"></script>

</body>
</html>
