<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:20px}
h2{color:#ffab7a;margin-bottom:4px}
.note{font-size:12px;color:#888;margin-bottom:16px}
.map{position:relative;width:100%;max-width:800px;aspect-ratio:600/900;background:#ede8de;margin:0 auto;border-radius:12px;overflow:hidden}

/* Roads */
.rh{position:absolute;left:0;right:0;background:#d8d0c6;z-index:1}
.rv{position:absolute;top:0;bottom:0;background:#d8d0c6;z-index:1}
.rh.main{background:#cec6ba;z-index:2}
.rv.main{background:#cec6ba;z-index:2}
.river{position:absolute;background:linear-gradient(180deg,#8abcd0,#7aafc0,#6a9eb0,#7aafc0,#8abcd0);z-index:1}

/* Block */
.blk{position:absolute;overflow:hidden;z-index:3}

/* Building */
.b{position:absolute;overflow:hidden;border-radius:1px}
.b img{width:100%;height:100%;object-fit:cover}
.b.lm{box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:5}
.b.lm::after{content:'';position:absolute;inset:-1.5px;border:2px solid #ffab7a;border-radius:2px;pointer-events:none}
.lbl{position:absolute;font-size:5.5px;color:#777;text-align:center;transform:translate(-50%,0);pointer-events:none;z-index:6}
.lbl.lm{font-size:6.5px;color:#333;font-weight:700}

/* Trees */
.t{position:absolute;border-radius:50%;background:radial-gradient(circle,#90c080,#70a060);z-index:4;opacity:.55}

.caption{max-width:800px;margin:16px auto;font-size:13px;line-height:1.8;color:#aaa}
</style>
</head>
