*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:20px}
h2{color:#c8a860;margin-bottom:4px}
.tag{display:inline-block;background:#c8a860;color:#1a1a2e;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700;margin-right:6px}
.note{font-size:12px;color:#888;margin-bottom:16px}
.map{position:relative;width:100%;max-width:700px;aspect-ratio:4/5;background:#ede8de;margin:0 auto;border-radius:12px;overflow:hidden}

/* Organic roads — slight curves via border-radius */
.road-h{position:absolute;left:0;right:0;background:#d4ccc0;z-index:1;border-radius:2px}
.road-v{position:absolute;top:0;bottom:0;background:#d4ccc0;z-index:1;border-radius:2px}
.road-h.main{background:#c8bfb2;z-index:2}
.road-v.main{background:#c8bfb2;z-index:2}
.river{position:absolute;background:linear-gradient(180deg,#8abcd0 0%,#7aafc0 30%,#6a9eb0 50%,#7aafc0 70%,#8abcd0 100%);z-index:1;border-radius:40% 30% 30% 40% / 10% 5% 5% 10%}

/* Organic blocks — slight rotation + varied shapes */
.blk-org{position:absolute;z-index:3;overflow:hidden}

/* SVG buildings — varied roof types */
.bld-svg{position:absolute;z-index:4;border-radius:2px}
.bld-svg .roof{position:absolute;left:0;right:0;border-radius:1px}
.bld-svg .wall{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 2px 2px}

/* Roof types */
.roof-pitch{background:linear-gradient(135deg,#5a4a3a 0%,#4a3a2c 30%,#3a2a1c 50%,#4a3a2c 70%,#5a4a3a 100%)}
.roof-red{background:linear-gradient(135deg,#8a5040 0%,#7a4030 30%,#6a3020 50%,#7a4030 70%,#8a5040 100%)}
.roof-flat{background:linear-gradient(180deg,#c8c4c0,#b8b4b0)}
.roof-blue{background:linear-gradient(135deg,#5a6a7a 0%,#4a5a6a 30%,#3a4a5a 50%,#4a5a6a 70%,#5a6a7a 100%)}

/* Wall types */
.wall-cream{background:linear-gradient(180deg,#e8dcc8,#e0d4c0)}
.wall-sand{background:linear-gradient(180deg,#d8c4a8,#d0bca0)}
.wall-brick{background:linear-gradient(180deg,#c8a080,#c09878)}
.wall-grey{background:linear-gradient(180deg,#d8d4d0,#d0ccc8)}
.wall-ivory{background:linear-gradient(180deg,#f0e8d8,#e8e0d0)}

/* Window patterns */
.win-grid{position:absolute;display:grid;gap:2px;opacity:.6}
.win-grid .w{background:#3a3a2a;border-radius:0.5px}

/* Landmark */
.lm{box-shadow:0 0 0 2px #ff8c42,0 2px 8px rgba(0,0,0,.3);z-index:8;border-radius:2px}
.lm-label{position:absolute;font-size:7px;color:#333;font-weight:700;text-align:center;transform:translate(-50%,-50%);pointer-events:none;z-index:9;background:rgba(255,255,255,.75);padding:1px 3px;border-radius:2px}

/* Trees */
.tree{position:absolute;border-radius:50%;z-index:5;opacity:.55}
.tree.t1{background:radial-gradient(circle,#90c080 30%,#70a060 70%,#5a8040)}
.tree.t2{background:radial-gradient(circle,#a0c890 30%,#80b070 70%,#6a9050)}

.ground{position:absolute;background:#ede8de;z-index:0}

.caption{max-width:700px;margin:16px auto;font-size:13px;line-height:1.8;color:#aaa}
.caption b{color:#c8a860}
</style>
</head>

<div class="caption">
  <b>方案C：有机生长法</b><br>
  · 纯SVG/CSS程序化生成建筑，零AI素材依赖<br>
  · 5种墙面 + 4种屋顶 = 20种建筑外观组合<br>
  · 窗户网格自动生成，模拟不同层数<br>
  · 建筑大小不一、高低错落，像老城自然生长<br>
  · 道路宽度有机变化，不用严格等宽<br>
  · <b>需要豆包生成：零</b>（全部代码生成）<br>
  · <b>实现复杂度：★★★★☆</b> &nbsp; <b>效果稳定度：中</b><br>
  · ⚠ 程序化建筑缺乏AI图片的细节和质感
